name: data_saver
description: Simple Flutter plugin to check the current Data Saver/Low Data Mode.
version: 0.5.0
repository: https://github.com/nikodembernat/data_saver
issue_tracker: https://github.com/nikodembernat/data_saver/issues
topics:
  - connectivity
  - network
  - data-saver
  - low-data-mode

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^26.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.nikodembernat.data_saver
        pluginClass: DataSaverPlugin
      ios:
        pluginClass: DataSaverPlugin
      macos:
        pluginClass: DataSaverPlugin
      web:
        pluginClass: DataSaverWeb
        fileName: src/web/data_saver_web.dart
