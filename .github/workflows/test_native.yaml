name: Test native code
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

# A newer commit on the same branch or pull request makes older runs obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test native code (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Matches `sourceCompatibility`/`jvmTarget` in `android/build.gradle.kts`.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4

      # Also writes `example/android/local.properties`, which `settings.gradle.kts`
      # reads to locate the Flutter SDK. Gradle fails without it.
      - name: Get dependencies
        working-directory: example
        run: flutter pub get

      # Also injects `example/android/gradlew`, which the Flutter app template
      # keeps out of version control, so this has to run before Gradle is used.
      - name: Build example
        working-directory: example
        run: flutter build apk --debug

      - name: Run unit tests
        working-directory: example/android
        run: ./gradlew :data_saver:testDebugUnitTest

  android_integration:
    name: Test native code (Android, toggling Data Saver)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4

      - name: Get dependencies
        working-directory: example
        run: flutter pub get

      # Without hardware acceleration the emulator takes too long to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Toggles the real setting between runs and checks what `checkMode()`
      # reports back, so an inverted or stale mapping fails the build.
      - name: Toggle Data Saver and check the reported mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: example
          script: |
            set -euo pipefail

            package="com.nikodembernat.data_saver_example"

            check() {
              echo "::group::Data Saver reports $1"
              flutter test integration_test --dart-define=expected_mode="$1"
              echo "::endgroup::"
            }

            adb wait-for-device

            adb shell cmd netpolicy set restrict-background false
            check disabled

            adb shell cmd netpolicy set restrict-background true
            check enabled

            # Data Saver stays on, but this app is now allowed to bypass it.
            #
            # The allowlist is keyed by UID, and `flutter test` uninstalls the app
            # once it is done - which frees that UID and gets a fresh one handed
            # out next time. So install first, read the UID off the installed
            # package, and let the run below reinstall in place over it.
            flutter build apk --debug
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            uid=$(adb shell pm list packages -U | grep "$package" | sed 's/.*uid://' | tr -d '\r')
            test -n "$uid"
            adb shell cmd netpolicy add restrict-background-whitelist "$uid"
            check whitelisted

  ios:
    name: Test native code (iOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4

      - name: Get dependencies
        working-directory: example
        run: flutter pub get

      # Integrates the plugin through Swift Package Manager, which is the only
      # supported option since 0.5.0.
      - name: Build example
        working-directory: example
        run: flutter build ios --no-codesign

      - name: Select a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys

          best = ()
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = tuple(int(part) for part in match.groups())
              for device in devices:
                  if device["name"].startswith("iPhone") and (not best or version > best[0]):
                      best = (version, device["udid"])
          if not best:
              sys.exit("No available iPhone simulator found.")
          print(best[1])
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Points `Generated.xcconfig` at a simulator debug build so that the
      # `Run Prepare Flutter Framework Script` phase unpacks the right engine.
      - name: Configure the example for a simulator
        working-directory: example
        run: flutter build ios --config-only --simulator --debug

      - name: Run unit tests
        working-directory: example/ios
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}"

      # Low Data Mode cannot be switched on from a runner, so only the
      # unconstrained state is assertable here. It still exercises the real
      # `NWPathMonitor` end to end, and an inverted mapping would report
      # `enabled` and fail. See `integration_test/data_saver_test.dart` for
      # checking the constrained state by hand.
      - name: Check the reported mode against the real network path
        working-directory: example
        run: |
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
          flutter test integration_test \
            -d "${{ steps.simulator.outputs.udid }}" \
            --dart-define=expected_mode=disabled

  macos:
    name: Test native code (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4

      - name: Get dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example
        working-directory: example
        run: flutter build macos --debug

      - name: Run unit tests
        working-directory: example/macos
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=macOS"

      # Same limitation as iOS: only the unconstrained state can be asserted on
      # a runner, but it still goes through the real `NWPathMonitor`.
      - name: Check the reported mode against the real network path
        working-directory: example
        run: flutter test integration_test -d macos --dart-define=expected_mode=disabled

  web:
    name: Test native code (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4

      - name: Get dependencies
        working-directory: example
        run: flutter pub get

      # `DataSaverWeb` reaches for `navigator.connection` through `package:web`,
      # so it has to keep compiling with both web compilers.
      - name: Build example (JavaScript)
        working-directory: example
        run: flutter build web

      - name: Build example (WebAssembly)
        working-directory: example
        run: flutter build web --wasm
